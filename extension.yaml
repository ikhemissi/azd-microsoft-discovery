# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/cli/azd/v1.35.0/cli/azd/extensions/extension.schema.json
id: ikhemissi.azd.discovery
namespace: discovery
displayName: Microsoft Discovery Community Extension
description: Build and publish containers, register Discovery tools, and reconcile prompt agents.
version: 0.2.0
requiredAzdVersion: ">=1.35.0"
language: go
capabilities:
  - custom-commands
  - metadata
  - lifecycle-events
  - service-target-provider
providers:
  - name: discovery.tool
    type: service-target
    description: Build and publish or reference an immutable tool image and register it.
  - name: discovery.agent
    type: service-target
    description: Reconcile a prompt agent using a verified model deployment name and tool bindings.
usage: azd discovery <command> [options]
examples:
  - name: plan
    description: Validate declared Discovery services without deploying them.
    usage: azd discovery plan --output json
  - name: doctor
    description: Check local configuration without asserting Azure readiness.
    usage: azd discovery doctor --output json
tags:
  - discovery
  - ai
  - research
