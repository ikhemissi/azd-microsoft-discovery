# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/cli/azd/v1.35.0/cli/azd/extensions/extension.schema.json
id: ikhemissi.azd.discovery
namespace: discovery
displayName: Microsoft Discovery Community Extension
description: Deploy Discovery tools, agents and knowledge bases, and explicitly validate/upload reusable input bundles.
version: 0.3.0
requiredAzdVersion: ">=1.35.0"
language: go
capabilities:
  - custom-commands
  - metadata
  - lifecycle-events
  - service-target-provider
providers:
  - name: discovery.tool
    type: service-target
    description: Build and publish or reference an immutable tool image and register it.
  - name: discovery.agent
    type: service-target
    description: Reconcile a prompt agent using a verified model, tool bindings and indexed KB attachments.
  - name: discovery.knowledgebase
    type: service-target
    description: Reconcile a GA knowledge base using existing Bookshelf/storage registrations and optionally index it.
usage: azd discovery <command> [options]
examples:
  - name: plan
    description: Validate declared Discovery services without deploying them.
    usage: azd discovery plan --output json
  - name: doctor
    description: Check local configuration without asserting Azure readiness.
    usage: azd discovery doctor --output json
  - name: index
    description: Index an existing, reconciled knowledge-base service.
    usage: azd discovery index literature
  - name: data-validate
    description: Validate a checksummed input bundle locally without execution.
    usage: azd discovery data validate experiment-a --local
  - name: data-prepare
    description: Create a local experiment checksum manifest without overwrite.
    usage: azd discovery data prepare experiment-a --local
  - name: data-upload
    description: Inspect the existing Blob destination without writes.
    usage: azd discovery data upload experiment-a --dry-run
  - name: data-show
    description: Show a verified IaC asset and its runtime locator for agent use.
    usage: azd discovery data show experiment-a --agent researcher
tags:
  - discovery
  - ai
  - research
