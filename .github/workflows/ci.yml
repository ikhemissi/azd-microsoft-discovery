name: Linux quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: discovery-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      AZD_COLLECT_TELEMETRY: "no"
      DISCOVERY_RELEASE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned git-cliff
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          bash scripts/install-git-cliff.sh "$RUNNER_TEMP/git-cliff"
      - name: Check formatting
        run: git ls-files -z -- '*.go' | xargs -0 gofmt -l | tee /tmp/gofmt-files; test ! -s /tmp/gofmt-files
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout 10m
      - name: Build, vet, race tests, coverage, and modernization
        run: bash scripts/check-go.sh
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-coverage
          path: coverage/

  native:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZD_COLLECT_TELEMETRY: "no"
      AZD_DISCOVERY_NATIVE_TESTS: "1"
      AZD_DISCOVERY_CONTAINER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install minimum azd host and Podman
        run: |
          echo "AZD_CONFIG_DIR=$RUNNER_TEMP/discovery-azd" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y podman jq
          curl --fail --location --retry 3 \
            https://github.com/Azure/azure-dev/releases/download/azure-dev-cli_1.35.0/azd-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/azd.tar.gz"
          mkdir -p "$RUNNER_TEMP/azd-minimum"
          tar -xzf "$RUNNER_TEMP/azd.tar.gz" -C "$RUNNER_TEMP/azd-minimum"
          sudo install "$RUNNER_TEMP/azd-minimum/azd-linux-amd64" /usr/local/bin/azd
          azd version
          podman --version
      - name: Build, install, test, and verify fresh bundle
        run: bash scripts/build-test-bundle.sh
      - name: Upload tested extension bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-bundle-linux-amd64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
